<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasure Hunt</title>
    <style>
        /* Your existing styles */
    </style>
</head>
<body>

    <!-- Welcome Page -->
    <div class="container" id="welcome-box">
        <h1> HEXCORE HUNT</h1>
        <p>Are you ready for the challenge?</p>
        <button class="button" onclick="startHunt()">Start the Treasure Hunt</button>
    </div>

    <!-- Login Form (Example) -->
    <div class="container" id="login-box">
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button class="button" onclick="submitLogin()">Login</button>
        <p id="login-message" class="message"></p>
    </div>

    <script>
        function startHunt() {
            document.getElementById("welcome-box").style.display = "none";
            document.getElementById("riddle1").style.display = "block";
        }

        function submitLogin() {
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            fetch("https://script.google.com/macros/s/AKfycbx_fhenE7xa8GhsOsS_3_-mdEXnd8twcWlIzEodM7oLkF8rxWyYjb5AaBulpe3jE0bx/exec", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    console.log("Login successful", data);
                    document.getElementById("login-message").innerHTML = "Login successful!";
                    document.getElementById("login-message").className = "message correct";
                    // Proceed to next part of your app
                } else {
                    console.log("Login failed", data.message);
                    document.getElementById("login-message").innerHTML = "Login failed: " + data.message;
                    document.getElementById("login-message").className = "message wrong";
                }
            })
            .catch(error => {
                console.error("Error connecting to backend", error);
                document.getElementById("login-message").innerHTML = "Error connecting to backend!";
                document.getElementById("login-message").className = "message wrong";
            });
        }
        
        function checkAnswer(riddleNum, correctAnswer, isLast = false) {
            var answerInput = document.getElementById("answer" + riddleNum);
            var message = document.getElementById("message" + riddleNum);
            var answer = answerInput.value.toLowerCase().trim();

            if (answer === correctAnswer) {
                message.innerHTML = "✅ Correct!";
                message.className = "message correct";
                setTimeout(() => {
                    document.getElementById("riddle" + riddleNum).style.display = "none";
                    if (isLast) {
                        document.getElementById("popup").style.display = "block";
                    } else {
                        document.getElementById("riddle" + (riddleNum + 1)).style.display = "block";
                    }
                }, 1000);
            } else {
                message.innerHTML = "❌ Wrong answer! Try again.";
                message.className = "message wrong";
            }
        }

        function showFinalLocation() {
            document.getElementById("popup").style.display = "none";
            document.getElementById("final-box").style.display = "block";
        }
    </script>

</body>
</html>
