<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Treasure Hunt</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://i.postimg.cc/gcTVS86D/1738657520755.jpg') no-repeat center center/cover;
            color: white;
            text-align: center;
        }
        .container {
            max-width: 700px;
            margin: 100px auto;
            padding: 40px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }
        input, button {
            padding: 12px;
            margin: 10px;
            font-size: 18px;
            border-radius: 5px;
            border: none;
            text-align: center;
        }
        .button {
            background: #ffcc00;
            cursor: pointer;
            font-weight: bold;
            transition: 0.4s;
        }
        .button:hover {
            background: #ff9900;
        }
        .message {
            font-size: 18px;
            margin-top: 15px;
        }
        .correct { color: #32cd32; }
        .wrong { color: #ff6347; }
    </style>
</head>
<body>

<div class="container" id="login-box">
    <h1>HEXCORE HUNT - Secure Login</h1>
    <input type="text" id="username" placeholder="Enter Username">
    <input type="password" id="password" placeholder="Enter Password">
    <button class="button" onclick="login()">Login</button>
    <p id="login-message" class="message"></p>
</div>

<div class="container" id="welcome-box" style="display:none;">
    <h1>Welcome to HEXCORE HUNT</h1>
    <p>Get ready for the ultimate challenge!</p>
    <button class="button" onclick="startHunt()">Start the Treasure Hunt</button>
    <button class="button" onclick="logout()">Logout</button>
</div>

<script>
    const validUsers = {
        "user123": "a19c9e7a9d1f2823e93d07d1c344493be4efcd0cc5ee7c25f7a02dc2de91c0ff" // SHA-256 hash of "password123"
    };

    async function hashPassword(password) {
        const encoder = new TextEncoder();
        const data = encoder.encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer))
                    .map(byte => byte.toString(16).padStart(2, '0'))
                    .join('');
    }

    async function login() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const loginMessage = document.getElementById("login-message");

        if (!username || !password) {
            loginMessage.innerHTML = "❌ Please enter username and password!";
            loginMessage.className = "message wrong";
            return;
        }

        const hashedPassword = await hashPassword(password);

        if (validUsers[username] === hashedPassword) {
            loginMessage.innerHTML = "✅ Login Successful!";
            loginMessage.className = "message correct";
            localStorage.setItem("sessionToken", generateToken());
            setTimeout(() => {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("welcome-box").style.display = "block";
            }, 1000);
        } else {
            loginMessage.innerHTML = "❌ Invalid Username or Password!";
            loginMessage.className = "message wrong";
        }
    }

    function generateToken() {
        return Math.random().toString(36).substr(2) + Date.now().toString(36);
    }

    function checkAuth() {
        if (localStorage.getItem("sessionToken")) {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("welcome-box").style.display = "block";
        }
    }

    function logout() {
        localStorage.removeItem("sessionToken");
        document.getElementById("welcome-box").style.display = "none";
        document.getElementById("login-box").style.display = "block";
    }

    window.onload = checkAuth;
</script>

</body>
</html>
