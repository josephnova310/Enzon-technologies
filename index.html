</style></head><body><h2>Vehicle Inspection Pro</h2><div class="container">Technician
<input id="tech">

Vehicle No
<input id="vehicle">

Date
<input type="date" id="date">

<br>Search
<input id="search" onkeyup="searchTable()" placeholder="Search component">

<table><thead>
<tr>
<th>Sl</th>
<th>System</th>
<th>Component</th>
<th>Checkpoint</th>
<th>Status</th>
<th>Notes</th>
<th>Photo</th>
</tr>
</thead><tbody id="tableBody"></tbody></table><div class="summary"><b>Dashboard</b><br>

PASS : <span id="passCount">0</span><br>
FAIL : <span id="failCount">0</span><br>
PENDING : <span id="pendingCount">86</span><br>
PASS % : <span id="passPercent">0%</span>

</div><button onclick="calculate()">Calculate</button>
<button onclick="saveInspection()">Save Inspection</button>
<button onclick="exportCSV()">Export Excel</button>
<button onclick="window.print()">Export PDF</button>

<h3>Inspection History</h3><ul id="history"></ul></div><script>

const body=document.getElementById("tableBody")

data.forEach(r=>{
body.innerHTML+=`
<tr>
<td>${r[0]}</td>
<td>${r[1]}</td>
<td>${r[2]}</td>
<td>${r[3]}</td>
<td>
<select onchange="updateRow(this)">
<option value="pending">Pending</option>
<option value="pass">PASS</option>
<option value="fail">FAIL</option>
</select>
</td>
<td><input placeholder="notes"></td>
<td><input type="file"></td>
</tr>`
})

function updateRow(s){
let row=s.parentElement.parentElement
row.classList.remove("pass","fail","pending")
row.classList.add(s.value)
}

function calculate(){

let selects=document.querySelectorAll("select")
let pass=0,fail=0,pending=0

selects.forEach(s=>{
if(s.value=="pass")pass++
else if(s.value=="fail")fail++
else pending++
})

let total=selects.length

document.getElementById("passCount").innerText=pass
document.getElementById("failCount").innerText=fail
document.getElementById("pendingCount").innerText=pending
document.getElementById("passPercent").innerText=((pass/total)*100).toFixed(2)+"%"

}

function searchTable(){

let input=document.getElementById("search").value.toLowerCase()
let rows=document.querySelectorAll("#tableBody tr")

rows.forEach(r=>{
r.style.display=r.innerText.toLowerCase().includes(input)?"":"none"
})

}

function saveInspection(){

let tech=document.getElementById("tech").value
let vehicle=document.getElementById("vehicle").value
let date=document.getElementById("date").value

let record=tech+" | "+vehicle+" | "+date

let history=JSON.parse(localStorage.getItem("history")||"[]")
history.push(record)

localStorage.setItem("history",JSON.stringify(history))

loadHistory()

}

function loadHistory(){

let history=JSON.parse(localStorage.getItem("history")||"[]")

let list=document.getElementById("history")

list.innerHTML=""

history.forEach(h=>{
list.innerHTML+="<li>"+h+"</li>"
})

}

function exportCSV(){

let rows=document.querySelectorAll("#tableBody tr")

let csv="Sl,System,Component,Checkpoint,Status\n"

rows.forEach(r=>{
let cols=r.querySelectorAll("td")
let status=r.querySelector("select").value
csv+=cols[0].innerText+","+cols[1].innerText+","+cols[2].innerText+","+cols[3].innerText+","+status+"\n"
})

let blob=new Blob([csv])
let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="inspection_report.csv"
a.click()

}

loadHistory()

</script></body>
</html>
